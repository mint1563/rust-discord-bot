[package]
name = "rust-discord-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12", features = ["client", "gateway", "model", "standard_framework"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
poise = "0.6.2"
rust-llm = { path = "./rust-llm" }
candle-core = "0.10.2"
candle-nn = "0.10.2"